<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="description" content="Profile of user on Pet Palace!" />
        <link rel="stylesheet" href="/src/scss/main.scss" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,200..900;1,200..900&display=swap" rel="stylesheet" />
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" />
        <title>Profile| Pet Palace</title>
    </head>
    <body>
        <header>
            <nav class="navbar navbar-expand-sm">
                <div class="container">
                    <h1>Pet Palace</h1>

                    <button
                        class="navbar-toggler"
                        type="button"
                        data-bs-toggle="collapse"
                        data-bs-target="#navbarContent"
                        aria-controls="navbarContent"
                        aria-expanded="false"
                        aria-label="Toggle navigation"
                    >
                        <i class="bi bi-list navbar-toggler-icon-custom"></i>
                    </button>

                    <div class="collapse navbar-collapse" id="navbarContent">
                        <div class="ms-auto d-flex flex-column flex-sm-row align-items-start align-items-sm-center gap-2 gap-sm-3">
                            <a class="nav-link" href="/feed.html">Feed</a>
                            <button id="logout-btn" class="btn btn-logout">Logout</button>
                        </div>
                    </div>
                </div>
            </nav>
        </header>
        <main id="main-profile" class="container">
            <div class="row">
                <section id="profile-info" class="col-12 col-lg-4">
                    <div class="sticky-lg-top sidebar-sticky row">
                        <div class="col col-lg-12">
                            <h1 id="profile-title"></h1>
                            <div class="container avatar-container">
                                <img id="profile-avatar" class="avatar-image" />
                            </div>
                        </div>
                        <div class="col col-lg-12 d-flex flex-column justify-content-end">
                            <div class="container mt-3">
                                <p><strong>Bio:</strong> <span id="profile-bio"></span></p>
                            </div>
                            <div class="container">
                                <p id="profile-email"></p>
                            </div>
                            <div class="container">
                                <button id="follow-btn" class="btn btn-secondary" style="display: none">Follow user</button>
                            </div>
                        </div>
                    </div>
                </section>

                <section id="profile-posts" class="col-12 col-lg-8"></section>
            </div>
        </main>
        <script type="module" src="/src/app.ts"></script>
        <script type="module" src="/src/pages/profile.ts"></script>
    </body>
</html>

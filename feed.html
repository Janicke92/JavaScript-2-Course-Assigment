<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="description" content="Feed page for Pet Palace!" />
        <link rel="stylesheet" href="/src/scss/main.scss" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,200..900;1,200..900&display=swap"
            rel="stylesheet"
        />
        <title>Feed | Pet Palace</title>
    </head>
    <body>
        <header>
            <div class="m-3">
                <h1>Pet Palace</h1>
            </div>
            <div class="m-3">
                <a href="/profile.html">Profile</a>
                <button id="logout-btn" class="btn btn-logout">Logout</button>
            </div>
        </header>
        <main id="feed-main">
            <p id="post-error" style="color: red; display: none"></p>
            <div>
                <div>
                    <form id="create-post-form">
                        <label for="title" class="form-label">Title</label>
                        <input id="title" class="form-control" name="title" type="text" required />

                        <label for="mediaUrl" class="form-label">Image URL</label>
                        <input id="mediaUrl" class="form-control" name="mediaUrl" type="url" required />

                        <label for="body" class="form-label">Post</label>
                        <textarea id="body" class="form-control" name="body" rows="4" required></textarea>
                        <button type="submit" class="btn btn-secondary mt-4">Create post</button>
                    </form>
                </div>

                <div>
                    <form id="search-form">
                        <label for="search-input" class="form-label">Search posts</label>
                        <input id="search-input" class="form-control" name="q" type="search" />
                        <button type="submit">Search</button>
                    </form>
                </div>
            </div>

            <div>
                <h2 id="feed-header">Feed</h2>
            </div>
            <section id="feed"></section>
        </main>

        <script type="module" src="/src/pages/feed.ts"></script>
    </body>
</html>
